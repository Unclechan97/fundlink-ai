server:
  port: 8081

spring:
  application:
    name: fundlink-ai
  datasource:
    url: jdbc:mysql://localhost:3306/fundlink?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-ai.sql

# MyBatis-Plus 配置
mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      table-prefix: ai_

# LLM Provider 配置（开发环境）
fundlink:
  llm:
    providers:
      deepseek:
        base-url: https://api.deepseek.com/v1
        api-key: ${DEEPSEEK_API_KEY:}
        default-model: deepseek-chat
        input-price: 0.00015    # USD/1K tokens (deepseek-chat)
        output-price: 0.0006
      qwen:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        api-key: ${QWEN_API_KEY:}
        # 注意: qwen provider 指向 deepseek 模型是有意配置，勿"修复"
        default-model: deepseek-v4-flash
        input-price: 0.002      # USD/1K tokens (qwen-plus)
        output-price: 0.008
      siliconflow:
        base-url: https://api.siliconflow.cn/v1
        api-key: ${SILICONFLOW_API_KEY:}
        default-model: Qwen/Qwen3-8B
        input-price: 0          # 免费模型
        output-price: 0
    # LLM 调用通用配置
    connect-timeout-seconds: 30      # HTTP 连接超时
    request-timeout-minutes: 10      # 单次请求超时

    # 路由策略
    router:
      default-provider: deepseek
      default-model: deepseek-chat
      fallback-chain: deepseek,qwen,siliconflow
      retry-max: 2
      task-routing:
        simple:
          provider: siliconflow
          model: Qwen/Qwen3-8B
        requirement:
          provider: deepseek
          model: deepseek-chat
        testgen:
          provider: deepseek
          model: deepseek-chat
        diagnosis:
          provider: siliconflow
          model: Qwen/Qwen3-8B

  # RAG 服务地址
  rag:
    base-url: http://localhost:8000
    # 服务间内部密钥（与 RAG 侧 RAG_INTERNAL_KEY 同值）；未配置时 WARN 并继续直连
    internal-key: ${RAG_INTERNAL_KEY:}
  # FundLink 服务地址（调现有 API 写入配置）
  admin:
    base-url: http://localhost:8080
  # Agent Loop 闭环配置
  loop:
    max-rounds: 3                   # 最大重试轮数
    decision-timeout-minutes: 10    # 人工决策等待超时
    # 线程池：核心 4 / 上限 16 / 队列 64 / CallerRunsPolicy（拒绝时回退调用线程）
    core-pool-size: 4
    max-pool-size: 16
    queue-capacity: 64

logging:
  level:
    com.fundlink.ai: DEBUG
    com.fundlink.ai.gateway: DEBUG
    # 关闭 SQL 日志
    com.fundlink.ai.mapper: WARN
    com.baomidou.mybatisplus: WARN
    org.mybatis: WARN
    org.springframework.jdbc: WARN
