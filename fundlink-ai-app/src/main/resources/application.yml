server:
  port: 8081

spring:
  application:
    name: fundlink-ai
  datasource:
    url: jdbc:mysql://localhost:3306/fundlink?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-ai.sql

# MyBatis-Plus 配置
mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      table-prefix: ai_

# LLM Provider 配置（开发环境）
fundlink:
  llm:
    providers:
      deepseek:
        base-url: https://api.deepseek.com/v1
        api-key: ${DEEPSEEK_API_KEY:}
        default-model: deepseek-chat
        input-price: 0.00015    # USD/1K tokens (deepseek-chat)
        output-price: 0.0006
      claude:
        base-url: https://api.anthropic.com/v1
        api-key: ${ANTHROPIC_API_KEY:}
        default-model: claude-haiku-4-5-20251001
        input-price: 0.0008     # USD/1K tokens (claude-haiku)
        output-price: 0.004
      qwen:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        api-key: ${QWEN_API_KEY:}
        default-model: qwen-plus
        input-price: 0.002      # USD/1K tokens (qwen-plus)
        output-price: 0.008
      siliconflow:
        base-url: https://api.siliconflow.cn/v1
        api-key: ${SILICONFLOW_API_KEY:sk-wzabjteielnrnyrjyskxxjnvetqwxpbapkohavopptciqvxq}
        default-model: Qwen/Qwen3-8B
        input-price: 0          # 免费模型
        output-price: 0
    # 路由策略
    router:
      default-provider: siliconflow
      fallback-chain: siliconflow,qwen,deepseek
      retry-max: 2

  # RAG 服务地址
  rag:
    base-url: http://localhost:8000
  # FundLink 服务地址（调现有 API 写入配置）
  admin:
    base-url: http://localhost:8080

logging:
  level:
    com.fundlink.ai: DEBUG
    com.fundlink.ai.gateway: DEBUG
    com.fundlink.ai.agent: DEBUG
    # 关闭 SQL 日志
    com.fundlink.ai.mapper: WARN
    com.baomidou.mybatisplus: WARN
    org.mybatis: WARN
    org.springframework.jdbc: WARN
    com.fundlink.ai.agent: DEBUG
